name: Fix full photo display

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gallery:
    if: ${{ !contains(github.event.head_commit.message, '[full-photo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make every photo fully visible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('photos.html')
          s = p.read_text(encoding='utf-8')

          old = '''.gallery figure > a:first-child img {
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: auto !important;
            object-fit: cover !important;
            object-position: center !important;
          }'''

          new = '''.gallery figure > a:first-child img {
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: auto !important;
            object-fit: contain !important;
            object-position: center !important;
            background: #e9e9e6 !important;
            transform: none !important;
          }
          .gallery figure:hover .gallery figure > a:first-child img,
          .gallery figure:hover > a:first-child img {
            transform: none !important;
          }'''

          if old not in s:
              raise SystemExit('Expected gallery CSS was not found; no changes made.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit gallery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.html
          git commit -m "Show full photos without cropping [full-photo-fix]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-photo-full-images.yml
          git commit -m "Remove temporary full photo fix workflow [full-photo-fix]"
          git push
