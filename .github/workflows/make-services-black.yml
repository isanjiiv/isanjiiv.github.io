name: Make service theme black

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-service-theme:
    if: ${{ !contains(github.event.head_commit.message, '[service-black]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Change service accent from green to black
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in ('index.html', 'services.html'):
              path = Path(filename)
              if not path.exists():
                  print(f'{filename}: not found, skipped')
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Only change the site's service accent variable. Existing layout,
              # content, links, icons, SEO and other colors remain untouched.
              text = re.sub(
                  r'(--accent-green\s*:\s*)#[0-9a-fA-F]{6}',
                  r'\g<1>#111111',
                  text,
                  count=1
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'{filename}: service accent changed to black')
              else:
                  print(f'{filename}: no accent declaration changed')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Match services theme with portfolio black accent [service-black]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/make-services-black.yml
          git commit -m "Remove temporary service theme workflow [service-black]"
          git push
