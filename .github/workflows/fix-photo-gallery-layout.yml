name: Fix photo gallery layout

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[photo-gallery-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply responsive gallery override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('photos.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="photo-gallery-layout-fix">'
          if marker not in s:
              css = '''\n<style id="photo-gallery-layout-fix">\n/* Final gallery layout: equal image areas without large blank spaces. */\n.gallery {\n  display: grid !important;\n  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;\n  gap: 22px !important;\n  align-items: start !important;\n}\n.gallery figure {\n  height: auto !important;\n  align-self: start !important;\n}\n.gallery figure > a:first-child {\n  width: 100% !important;\n  height: 420px !important;\n  display: block !important;\n  overflow: hidden !important;\n  background: #e9e9e6 !important;\n}\n.gallery figure > a:first-child img {\n  width: 100% !important;\n  height: 100% !important;\n  aspect-ratio: auto !important;\n  object-fit: cover !important;\n  object-position: center !important;\n}\n.gallery figcaption {\n  min-height: 76px !important;\n}\n@media (max-width: 900px) {\n  .gallery {\n    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n    gap: 18px !important;\n  }\n  .gallery figure > a:first-child {\n    height: 360px !important;\n  }\n}\n@media (max-width: 560px) {\n  .gallery {\n    grid-template-columns: 1fr !important;\n    gap: 18px !important;\n  }\n  .gallery figure > a:first-child {\n    height: min(125vw, 500px) !important;\n    min-height: 360px !important;\n  }\n  .gallery figcaption {\n    min-height: 70px !important;\n  }\n}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Fix already present')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.html
          if git diff --cached --quiet; then
            echo "No gallery changes needed."
          else
            git commit -m "Improve responsive photo gallery layout [photo-gallery-fix]"
            git push
          fi
          git rm .github/workflows/fix-photo-gallery-layout.yml
          git commit -m "Remove temporary photo gallery workflow [photo-gallery-fix]"
          git push
